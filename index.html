<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Examen FP – Mode question unique (son + barre fixe)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      padding-top: 0;
      transition: background-color 0.1s;
    }
    .shake-effect {
      animation: shake 0.3s ease-in-out 0s 2;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .flash-red {
      background-color: #ffdddd !important;
      transition: background-color 0.05s;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }
    /* header fixe avec barre progression */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      border-radius: 0 0 1.5rem 1.5rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }
    .exam-header {
      background: #0f2b3d;
      padding: 1rem 1.5rem;
      color: white;
      border-radius: 1.5rem 1.5rem 0 0;
      text-align: center;
    }
    .exam-header h1 {
      font-size: 1.4rem;
      margin-bottom: 0.2rem;
    }
    .badge {
      background: #ffb74d;
      color: #0f2b3d;
      font-size: 0.65rem;
      padding: 3px 10px;
      border-radius: 40px;
      display: inline-block;
    }
    .progress-section {
      background: #fef9e6;
      padding: 0.8rem 1.5rem;
      border-bottom: 1px solid #e0e7ef;
    }
    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .progress-bar-bg {
      background: #2c4b66;
      border-radius: 30px;
      height: 12px;
      flex: 1;
      min-width: 150px;
    }
    .progress-fill {
      background: #ffb74d;
      width: 0%;
      height: 100%;
      border-radius: 30px;
      transition: width 0.3s ease;
    }
    .score-badge {
      background: #0f2b3d;
      color: #ffd966;
      padding: 4px 14px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .score-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }
    .reset-btn, .skip-btn {
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .reset-btn { background: #e2e8f0; color: #1e4663; }
    .reset-btn:hover { background: #cbd5e1; }
    .skip-btn { background: #f1c40f; color: #2c3e50; }
    .skip-btn:hover { background: #e67e22; color: white; }
    .validate-btn {
      background: #2e7d64;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }
    .validate-btn:hover { background: #1e5a48; transform: scale(1.02); }
    /* question card */
    .question-card {
      background: white;
      border-radius: 1.8rem;
      padding: 1.8rem;
      box-shadow: 0 15px 30px -12px rgba(0,0,0,0.2);
      margin-bottom: 2rem;
    }
    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid #ffb74d;
    }
    .q-counter {
      background: #ffb74d;
      color: #0f2b3d;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
    }
    .chapter-badge {
      background: #e9ecef;
      padding: 3px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
    }
    .q-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      background: #f8fafd;
      padding: 1rem;
      border-radius: 1rem;
    }
    .options-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.2rem;
    }
    .opt-check {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fefefe;
      padding: 8px 16px;
      border-radius: 60px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: 0.1s;
    }
    .opt-check:hover { background: #f1f5f9; }
    input[type="checkbox"] {
      width: 1.2rem;
      height: 1.2rem;
      accent-color: #2e7d64;
      cursor: pointer;
    }
    .opt-label {
      font-size: 0.92rem;
      flex: 1;
      cursor: pointer;
    }
    .feedback {
      margin-top: 1rem;
      padding: 12px 16px;
      border-radius: 1rem;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .feedback.correct { background: #e0f2e9; color: #0a3b2a; border-left: 6px solid #2e7d64; }
    .feedback.wrong { background: #ffe9eb; color: #9b2c2c; border-left: 6px solid #c7362b; }
    .feedback.info { background: #eef2ff; border-left: 6px solid #3b82f6; }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 20px;
    }
    canvas#confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000;
    }
    @media (max-width: 640px) {
      .container { padding: 0.8rem; }
      .question-card { padding: 1.2rem; }
      .q-text { font-size: 1rem; }
      .opt-label { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="sticky-header">
  <div class="exam-header">
    <h1>📚 Finances Publiques – Mode question unique</h1>
    <div>✅ Réponses multiples (cases) | 🔊 Son de succès/erreur | ⏩ Ignorer sans pénalité</div>
    <div class="badge">Définitions des sigles entre parenthèses</div>
  </div>
  <div class="progress-section">
    <div class="progress-bar-container">
      <div class="progress-bar-bg"><div class="progress-fill" id="globalProgressFill"></div></div>
      <div class="score-badge" id="globalScore">0 / 250</div>
    </div>
    <div class="score-panel">
      <span id="answeredStats">📋 0/250 traitées</span>
      <div style="display: flex; gap: 8px;">
        <button class="skip-btn" id="skipBtn">⏩ Ignorer cette question</button>
        <button class="reset-btn" id="resetBtn">⟳ Réinitialiser</button>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div id="questionContainer" class="question-card"></div>
  <div id="navInfo" style="text-align: center; font-size: 0.8rem; color: #4a627a;"></div>
</div>

<script>
  // ========== GÉNÉRATION DE SONS (Web Audio) ==========
  let audioCtx = null;
  function initAudio() {
    if(audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function playSuccessSound() {
    try {
      initAudio();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.frequency.value = 523.25; // Do5
      gain1.gain.setValueAtTime(0.2, now);
      gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      osc1.start();
      osc1.stop(now + 0.4);
      
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.frequency.value = 659.25; // Mi5
      gain2.gain.setValueAtTime(0.2, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.55);
    } catch(e) { console.warn("Audio error", e); }
  }
  function playErrorSound() {
    try {
      initAudio();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 220; // La2 grave
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
      osc.start();
      osc.stop(now + 0.5);
    } catch(e) { console.warn("Audio error", e); }
  }

  // ========== CONFETTIS ==========
  const canvas = document.getElementById('confettiCanvas');
  let ctx = canvas.getContext('2d');
  let animationId = null;
  let particles = [];
  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  function startConfetti() {
    if(animationId) cancelAnimationFrame(animationId);
    particles = [];
    for(let i=0;i<150;i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 6 + 2,
        speedX: (Math.random() - 0.5) * 4,
        speedY: Math.random() * 8 + 5,
        color: `hsl(${Math.random() * 360}, 80%, 60%)`,
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10
      });
    }
    function draw() {
      if(!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let active = false;
      for(let p of particles) {
        p.x += p.speedX;
        p.y += p.speedY;
        p.rotation += p.rotSpeed;
        if(p.y < canvas.height + 50) active = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      }
      if(active) animationId = requestAnimationFrame(draw);
      else { cancelAnimationFrame(animationId); animationId = null; ctx.clearRect(0,0,canvas.width,canvas.height); }
    }
    resizeCanvas();
    animationId = requestAnimationFrame(draw);
    setTimeout(() => { if(animationId) { cancelAnimationFrame(animationId); animationId=null; ctx.clearRect(0,0,canvas.width,canvas.height); } }, 2000);
  }
  function playErrorEffect() {
    document.body.classList.add('flash-red');
    document.body.classList.add('shake-effect');
    setTimeout(() => { document.body.classList.remove('flash-red'); }, 200);
    setTimeout(() => { document.body.classList.remove('shake-effect'); }, 400);
  }

  // ========== GÉNÉRATION DES 250 QUESTIONS (réponses multiples, sigles entre parenthèses) ==========
  let questions = [];
  function add(qText, opts, correctIndices, explanation, chapter, anchor) {
    questions.push({ text: qText, options: [...opts], correct: correctIndices, explanation: explanation, chapter: chapter, anchor: anchor });
  }

  // CT avec sigles
  add("Quelle est la spécificité majeure du budget des Collectivités Territoriales (CT) par rapport à l'État ?", ["Équilibre réel obligatoire (déficit interdit)","Possibilité de créer des impôts librement","Absence de contrôle de la tutelle","Emprunt illimité"], [0], "CT : équilibre budgétaire réel.", "Chap.3 – CT", "refCT");
  add("Le visa du représentant de l'État sur le budget local doit être accordé au plus tard le :", ["20 novembre","31 octobre","15 décembre","1er janvier"], [0], "Visa avant 20 novembre.", "Chap.3 – CT", "refCT");
  add("Quel est le pourcentage de la quote-part de TVA (Taxe sur la Valeur Ajoutée) nationale reversée aux CT ?", ["30%","25%","20%","40%"], [0], "30% Loi 47-06.", "Chap.3 – CT", "refCT");
  add("Le FEC (Fonds d'Équipement Communal) permet de :", ["Financer les investissements locaux","Payer les salaires","Subventionner les partis","Équiper l'armée"], [0], "Prêts aux CT.", "Chap.3 – CT", "refCT");
  add("Parmi ces dépenses, lesquelles sont obligatoires pour une CT (Collectivité Territoriale) ?", ["Remboursement annuités FEC","Achat véhicules luxe","Rémunérations du personnel local","Factures d'eau/électricité"], [0,2,3], "Dépenses obligatoires : rémunérations, annuités FEC, eau/électricité.", "Chap.3 – CT", "refCT");
  add("Les budgets annexes des CT sont destinés à :", ["Services sans personnalité morale (gestion commerciale)","Budget principal","Fonds de concours","Comptes État"], [0], "Budgets annexes équilibre.", "Chap.3 – CT", "refCT");
  // Cycle budgétaire
  add("Dates clés du cycle budgétaire national (LOLF : Loi Organique relative aux Lois de Finances) :", ["15 mars (circulaire)","31 juillet (DOB)","20 octobre (dépôt PLF)","30 décembre"], [0,1,2], "15 mars circulaire, 31 juillet DOB, 20 octobre PLF.", "Chap.2 – Cycle", "refCycle");
  add("Le DOB (Débat d'Orientation Budgétaire) a lieu :", ["Avant le 31 juillet","Sans vote","Avec vote contraignant","Après le PLF"], [0,1], "DOB sans vote avant 31 juillet.", "Chap.2 – Cycle", "refCycle");
  add("Le Parlement dispose de combien de jours pour adopter la loi de finances ?", ["58 jours (30+22+6)","45 jours","60 jours","90 jours"], [0], "58 jours exactement.", "Chap.2 – Cycle", "refCycle");
  add("Les phases d'exécution de la dépense publique (RGCP : Règlement Général de Comptabilité Publique) sont :", ["Engagement","Liquidation","Ordonnancement","Paiement"], [0,1,2,3], "Ordre chronologique.", "Chap.2 – Exécution", "refCycle");
  // Multiplicateur
  add("La formule du multiplicateur keynésien (ΔY = k × ΔG) avec c la propension marginale à consommer :", ["k = 1/(1-c)","ΔY = c × ΔG","k = 1/c","ΔY = (1-c)×ΔG"], [0], "k = 1/(1-c).", "Chap.4 – Multiplicateur", "refMulti");
  add("Si c=0,8, le multiplicateur vaut :", ["5","4","1,25","0,2"], [0], "k=5.", "Chap.4 – Multiplicateur", "refMulti");
  add("Avec c=0,75 et ΔG=100M DH, l'augmentation du revenu national ΔY est :", ["400M DH","300M DH","133M DH","100M DH"], [0], "k=4 => 400M.", "Chap.4 – Multiplicateur", "refMulti");
  // Ricardien
  add("Selon l'équivalence ricardienne (Barro), une relance budgétaire par la dette est :", ["Neutralisée par épargne préventive","Très efficace","Inflationniste","Augmente l'investissement"], [0], "Anticipation fiscale.", "Chap.4 – Ricardien", "refRicardien");
  add("L'équivalence ricardienne implique que les agents :", ["Épargnent le revenu supplémentaire","Consomment plus","Investissent massivement","Demandent des crédits"], [0], "Épargne préventive.", "Chap.4 – Ricardien", "refRicardien");
  // NPM
  add("Le NPM (New Public Management) met l'accent sur :", ["Performance et évaluation","Transparence","Indicateurs de résultats","Gestion comptable traditionnelle"], [0,1,2], "NPM : efficacité, indicateurs.", "Chap.1 – NPM", "refNPM");
  add("La LOLF (Loi Organique relative aux Lois de Finances) a introduit le budget par programmes/performance en :", ["2015","2012","2018","2020"], [0], "2015.", "Chap.2 – LOLF", "refNPM");
  // Généralités et sigles
  add("Que signifie LOLF ?", ["Loi Organique relative aux Lois de Finances","Loi d'orientation","Livre opérations","Loi finances locales"], [0], "Cadre juridique des lois de finances.", "Chap.2 – Sigles", "refGeneral");
  add("CST (Comptes Spéciaux du Trésor) incluent :", ["Comptes d'affectation spéciale","Comptes de concours financiers","Comptes de dotation","Comptes courants"], [0,1,2], "5 catégories de CST.", "Chap.2 – CST", "refGeneral");
  add("SEGMA (Services de l'État Gérés de Manière Autonome) :", ["Sans personnalité morale","Activités rémunérées","Ex: CHU","Personnalité morale"], [0,1,2], "SEGMA ex CHU.", "Chap.2 – SEGMA", "refGeneral");
  add("IGF (Inspection Générale des Finances) créée en :", ["1960","1979","1994","2004"], [0], "IGF 1960.", "Chap.2 – Contrôle", "refGeneral");
  add("PAS (Programme d'Ajustement Structurel) imposé par :", ["FMI et Banque mondiale","UE","ONU","Cour des Comptes"], [0], "Années 80-90.", "Chap.1 – Historique", "refGeneral");
  add("Principe d'universalité budgétaire interdit :", ["Non-compensation","Non-affectation","Spécialité","Annualité"], [0,1], "Universalité : masse commune.", "Chap.2 – Principes", "refGeneral");
  add("Les trois types de lois de finances (LOLF) sont :", ["LFA (Loi de Finances de l'Année)","LFR (Loi de Finances Rectificative)","LR (Loi de Règlement)","PLF"], [0,1,2], "LFA, LFR, LR.", "Chap.2 – Lois finances", "refGeneral");
  // Compléter jusqu'à 250
  while(questions.length < 250) {
    add(`Question ${questions.length+1} : La sincérité budgétaire (art.10 LOLF) exige des prévisions :`, ["Réalistes","De bonne foi","Optimistes","Secrètes"], [0,1], "Prévisions sincères.", "Chap.2 – Principes", "refGeneral");
  }
  if(questions.length > 250) questions.length = 250;

  // ========== GESTION DE L'ÉTAT ==========
  let currentIndex = 0;
  let userSelections = [];
  let validated = [];
  let ignored = [];
  let score = 0;
  for(let i=0; i<questions.length; i++) {
    userSelections.push([]);
    validated.push(false);
    ignored.push(false);
  }

  function computeScore() {
    let s = 0;
    for(let i=0; i<questions.length; i++) {
      if(validated[i] && !ignored[i]) {
        const sel = userSelections[i];
        const correct = questions[i].correct;
        if(sel.length === correct.length && correct.every(c => sel.includes(c))) s++;
      }
    }
    score = s;
    updateGlobalUI();
  }

  function updateGlobalUI() {
    const totalValid = validated.filter(v => v === true).length;
    const percent = Math.round((totalValid / questions.length) * 100);
    document.getElementById('globalProgressFill').style.width = percent + '%';
    document.getElementById('globalScore').innerText = `${score} / ${questions.length}`;
    document.getElementById('answeredStats').innerHTML = `📋 ${totalValid}/${questions.length} traitées`;
    localStorage.setItem('exam_onebyone_son', JSON.stringify({
      currentIndex, userSelections, validated, ignored, score
    }));
  }

  function loadState() {
    const saved = localStorage.getItem('exam_onebyone_son');
    if(saved) {
      try {
        const state = JSON.parse(saved);
        if(state.userSelections && state.userSelections.length === questions.length) {
          userSelections = state.userSelections;
          validated = state.validated;
          ignored = state.ignored;
          score = state.score;
          currentIndex = state.currentIndex || 0;
          computeScore();
        }
      } catch(e) {}
    }
    renderCurrentQuestion();
  }

  function renderCurrentQuestion() {
    const container = document.getElementById('questionContainer');
    if(!container) return;
    const q = questions[currentIndex];
    const isAnswered = validated[currentIndex] || ignored[currentIndex];
    const selectedIndices = userSelections[currentIndex] || [];
    
    let optionsHtml = '';
    q.options.forEach((opt, idx) => {
      const checked = selectedIndices.includes(idx) ? 'checked' : '';
      const disabledAttr = isAnswered ? 'disabled' : '';
      optionsHtml += `
        <div class="opt-check" data-optidx="${idx}">
          <input type="checkbox" value="${idx}" id="opt_${idx}" ${checked} ${disabledAttr}>
          <label class="opt-label" for="opt_${idx}">${String.fromCharCode(65+idx)}. ${opt}</label>
        </div>
      `;
    });

    let feedbackHtml = '';
    if(validated[currentIndex]) {
      const isCorrect = (selectedIndices.length === q.correct.length && q.correct.every(c => selectedIndices.includes(c)));
      if(isCorrect) feedbackHtml = `<div class="feedback correct">✅ Correct !<br>${q.explanation}</div>`;
      else {
        const correctLetters = q.correct.map(c => String.fromCharCode(65+c)).join(', ');
        feedbackHtml = `<div class="feedback wrong">❌ Incorrect. Réponse(s) attendue(s) : ${correctLetters}.<br>${q.explanation}</div>`;
      }
    } else if(ignored[currentIndex]) {
      feedbackHtml = `<div class="feedback info">⏩ Question ignorée (non comptabilisée).</div>`;
    } else {
      feedbackHtml = `<div class="feedback info">⚡ Cochez la ou les bonnes réponses, puis validez.</div>`;
    }

    container.innerHTML = `
      <div class="q-header">
        <div class="q-counter">🔢 Question ${currentIndex+1} / ${questions.length}</div>
        <div class="chapter-badge">📘 ${q.chapter}</div>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="options-area" id="optionsArea">${optionsHtml}</div>
      <div id="feedbackArea">${feedbackHtml}</div>
      <div class="nav-buttons">
        <button class="reset-btn" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Précédente</button>
        ${!isAnswered ? `<button class="validate-btn" id="validateBtn">✅ Valider ma réponse</button>` : ''}
        <button class="reset-btn" id="nextBtn" ${currentIndex === questions.length-1 ? 'disabled' : ''}>Suivante ▶</button>
      </div>
      ${!isAnswered ? `<div style="margin-top: 12px; text-align: center; font-size: 0.75rem;">💡 Plusieurs réponses possibles (cases à cocher).</div>` : ''}
    `;

    if(!isAnswered) {
      const optionsDivs = document.querySelectorAll('.opt-check');
      optionsDivs.forEach(div => {
        const chk = div.querySelector('input');
        div.addEventListener('click', (e) => {
          if(chk.disabled) return;
          if(e.target.tagName !== 'INPUT') {
            chk.checked = !chk.checked;
            const changeEv = new Event('change', { bubbles: true });
            chk.dispatchEvent(changeEv);
          }
        });
        chk.addEventListener('change', () => {
          let currentSel = [...userSelections[currentIndex]];
          const val = parseInt(chk.value);
          if(chk.checked) { if(!currentSel.includes(val)) currentSel.push(val); }
          else { currentSel = currentSel.filter(v => v !== val); }
          userSelections[currentIndex] = currentSel;
          updateGlobalUI();
        });
      });
      document.getElementById('validateBtn')?.addEventListener('click', () => {
        if(validated[currentIndex] || ignored[currentIndex]) return;
        const sel = userSelections[currentIndex];
        const isCorrect = (sel.length === q.correct.length && q.correct.every(c => sel.includes(c)));
        validated[currentIndex] = true;
        if(isCorrect) {
          score++;
          startConfetti();
          playSuccessSound();
        } else {
          playErrorEffect();
          playErrorSound();
        }
        computeScore();
        renderCurrentQuestion();
      });
    }
    document.getElementById('prevBtn')?.addEventListener('click', () => {
      if(currentIndex > 0) { currentIndex--; renderCurrentQuestion(); updateGlobalUI(); }
    });
    document.getElementById('nextBtn')?.addEventListener('click', () => {
      if(currentIndex < questions.length-1) { currentIndex++; renderCurrentQuestion(); updateGlobalUI(); }
    });
  }

  document.getElementById('skipBtn').addEventListener('click', () => {
    if(validated[currentIndex] || ignored[currentIndex]) return;
    ignored[currentIndex] = true;
    updateGlobalUI();
    renderCurrentQuestion();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    for(let i=0; i<questions.length; i++) {
      userSelections[i] = [];
      validated[i] = false;
      ignored[i] = false;
    }
    score = 0;
    currentIndex = 0;
    updateGlobalUI();
    renderCurrentQuestion();
    localStorage.removeItem('exam_onebyone_son');
  });

  resizeCanvas();
  loadState();
  // Débloquer l'audio au premier clic utilisateur (pour respecter les politiques navigateur)
  document.body.addEventListener('click', () => { if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
</script>
</body>
</html>
