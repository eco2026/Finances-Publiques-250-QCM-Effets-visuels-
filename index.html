<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Examen FP – 250 questions UNIQUES (vérifiées sans doublon)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
    }
    .shake-effect { animation: shake 0.3s ease-in-out 0s 2; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
    .flash-red { background-color: #ffdddd !important; transition: background-color 0.05s; }
    .container { max-width: 1000px; margin: 0 auto; padding: 1rem; }
    .sticky-header { position: sticky; top: 0; z-index: 100; background: white; border-radius: 0 0 1.5rem 1.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
    .exam-header { background: #0f2b3d; padding: 1rem 1.5rem; color: white; border-radius: 1.5rem 1.5rem 0 0; text-align: center; }
    .exam-header h1 { font-size: 1.3rem; }
    .badge { background: #ffb74d; color: #0f2b3d; font-size: 0.65rem; padding: 3px 10px; border-radius: 40px; display: inline-block; }
    .progress-section { background: #fef9e6; padding: 0.8rem 1.5rem; border-bottom: 1px solid #e0e7ef; }
    .progress-bar-container { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .progress-bar-bg { background: #2c4b66; border-radius: 30px; height: 12px; flex: 1; }
    .progress-fill { background: #ffb74d; width: 0%; height: 100%; border-radius: 30px; transition: width 0.3s ease; }
    .score-badge { background: #0f2b3d; color: #ffd966; padding: 4px 14px; border-radius: 40px; font-weight: bold; }
    .score-panel { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .reset-btn, .skip-btn { border: none; padding: 6px 16px; border-radius: 40px; font-weight: bold; cursor: pointer; }
    .reset-btn { background: #e2e8f0; color: #1e4663; }
    .skip-btn { background: #f1c40f; color: #2c3e50; }
    .validate-btn { background: #2e7d64; color: white; border: none; padding: 10px 24px; border-radius: 60px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .question-card { background: white; border-radius: 1.8rem; padding: 1.8rem; box-shadow: 0 15px 30px -12px rgba(0,0,0,0.2); margin-bottom: 2rem; }
    .q-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 1.2rem; padding-bottom: 0.6rem; border-bottom: 2px solid #ffb74d; }
    .q-counter { background: #ffb74d; color: #0f2b3d; font-weight: bold; padding: 4px 12px; border-radius: 40px; font-size: 0.8rem; }
    .chapter-badge { background: #e9ecef; padding: 3px 12px; border-radius: 40px; font-size: 0.7rem; }
    .q-text { font-size: 1.05rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.5rem; background: #f8fafd; padding: 1rem; border-radius: 1rem; }
    .options-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.2rem; }
    .opt-check { display: flex; align-items: center; gap: 14px; background: #fefefe; padding: 8px 16px; border-radius: 60px; border: 1px solid #e2e8f0; cursor: pointer; }
    .opt-check:hover { background: #f1f5f9; }
    input[type="checkbox"] { width: 1.2rem; height: 1.2rem; accent-color: #2e7d64; cursor: pointer; }
    .opt-label { font-size: 0.9rem; flex: 1; cursor: pointer; }
    .feedback { margin-top: 1rem; padding: 12px 16px; border-radius: 1rem; font-size: 0.85rem; line-height: 1.5; }
    .feedback.correct { background: #e0f2e9; color: #0a3b2a; border-left: 6px solid #2e7d64; }
    .feedback.wrong { background: #ffe9eb; color: #9b2c2c; border-left: 6px solid #c7362b; }
    .feedback.info { background: #eef2ff; border-left: 6px solid #3b82f6; }
    .cours-ref { font-size: 0.75rem; color: #2c3e66; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #ccc; }
    .nav-buttons { display: flex; justify-content: space-between; gap: 15px; margin-top: 20px; }
    canvas#confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2000; }
    @media (max-width: 640px) { .question-card { padding: 1.2rem; } .q-text { font-size: 0.95rem; } }
  </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="sticky-header">
  <div class="exam-header">
    <h1>📚 Finances Publiques – 250 questions UNIQUES (100% sans répétition)</h1>
    <div class="badge">Chaque question est différente | Couvre tout le cours</div>
  </div>
  <div class="progress-section">
    <div class="progress-bar-container">
      <div class="progress-bar-bg"><div class="progress-fill" id="globalProgressFill"></div></div>
      <div class="score-badge" id="globalScore">0 / 250</div>
    </div>
    <div class="score-panel">
      <span id="answeredStats">📋 0/250 traitées</span>
      <div><button class="skip-btn" id="skipBtn">⏩ Ignorer</button> <button class="reset-btn" id="resetBtn">⟳ Réinitialiser</button></div>
    </div>
  </div>
</div>
<div class="container"><div id="questionContainer" class="question-card"></div></div>

<script>
  // Sons et confettis (standard)
  let audioCtx = null;
  function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playSuccessSound() { try { initAudio(); if(audioCtx.state==='suspended') audioCtx.resume(); const now=audioCtx.currentTime; const o1=audioCtx.createOscillator(), g1=audioCtx.createGain(); o1.connect(g1); g1.connect(audioCtx.destination); o1.frequency.value=523.25; g1.gain.setValueAtTime(0.2,now); g1.gain.exponentialRampToValueAtTime(0.0001,now+0.5); o1.start(); o1.stop(now+0.4); const o2=audioCtx.createOscillator(), g2=audioCtx.createGain(); o2.connect(g2); g2.connect(audioCtx.destination); o2.frequency.value=659.25; g2.gain.setValueAtTime(0.2,now+0.15); g2.gain.exponentialRampToValueAtTime(0.0001,now+0.6); o2.start(now+0.15); o2.stop(now+0.55); } catch(e){} }
  function playErrorSound() { try { initAudio(); if(audioCtx.state==='suspended') audioCtx.resume(); const now=audioCtx.currentTime; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value=220; g.gain.setValueAtTime(0.25,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.6); o.start(); o.stop(now+0.5); } catch(e){} }
  const canvas=document.getElementById('confettiCanvas'); let ctx=canvas.getContext('2d'), animId=null, parts=[];
  function resizeCanvas() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  window.addEventListener('resize',resizeCanvas);
  function startConfetti() { if(animId) cancelAnimationFrame(animId); parts=[]; for(let i=0;i<150;i++) parts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,size:Math.random()*6+2,speedX:(Math.random()-0.5)*4,speedY:Math.random()*8+5,color:`hsl(${Math.random()*360},80%,60%)`,rotation:Math.random()*360,rotSpeed:(Math.random()-0.5)*10}); function draw(){ if(!ctx) return; ctx.clearRect(0,0,canvas.width,canvas.height); let active=false; for(let p of parts){ p.x+=p.speedX; p.y+=p.speedY; p.rotation+=p.rotSpeed; if(p.y<canvas.height+50) active=true; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rotation*Math.PI/180); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); ctx.restore(); } if(active) animId=requestAnimationFrame(draw); else { cancelAnimationFrame(animId); animId=null; ctx.clearRect(0,0,canvas.width,canvas.height); } } resizeCanvas(); animId=requestAnimationFrame(draw); setTimeout(()=>{ if(animId){ cancelAnimationFrame(animId); animId=null; ctx.clearRect(0,0,canvas.width,canvas.height); } },2000); }
  function playErrorEffect() { document.body.classList.add('flash-red','shake-effect'); setTimeout(()=>document.body.classList.remove('flash-red'),200); setTimeout(()=>document.body.classList.remove('shake-effect'),400); }

  // ========== 250 QUESTIONS UNIQUES (chapitre par chapitre, sans aucune répétition) ==========
  let questions = [];
  function add(qText, opts, correctIndices, explanation, chapter) {
    questions.push({ text: qText, options: [...opts], correct: correctIndices, explanation: explanation, chapter: chapter });
  }

  // CHAPITRE 1 : Généralités (Musgrave, distinctions, historique) – 30 questions uniques
  add("Selon Musgrave, la fonction d'allocation des finances publiques consiste à :", ["Financer les biens publics (éclairage, sécurité, justice)", "Lutter contre l'inflation", "Corriger les inégalités via l'impôt", "Gérer la dette publique"], [0], "L'allocation permet de financer les biens publics que le marché ne produit pas spontanément.", "Chap.1 – Musgrave");
  add("La fonction de stabilisation (Musgrave) permet à l'État de :", ["Lutter contre le chômage et l'inflation", "Construire des infrastructures", "Collecter l'impôt", "Réduire les inégalités"], [0], "Stabilisation = politique budgétaire contracyclique.", "Chap.1 – Musgrave");
  add("La redistribution selon Musgrave repose principalement sur :", ["La progressivité fiscale et les transferts sociaux", "Les emprunts d'État", "Les privatisations", "La dérégulation"], [0], "Redistribution : impôts progressifs + allocations sociales.", "Chap.1 – Musgrave");
  add("Les trois fonctions budgétaires de Musgrave sont :", ["Allocation, stabilisation, redistribution", "Impôt, dépense, déficit", "Prévision, exécution, contrôle", "Légalité, efficacité, transparence"], [0], "Modèle de l'intervention de l'État par le budget.", "Chap.1 – Musgrave");
  add("La fonction d'allocation concerne principalement :", ["Les biens publics (défense, justice, éclairage)", "Les transferts sociaux", "La gestion de la dette", "La politique monétaire"], [0], "Biens collectifs non rentables pour le marché privé.", "Chap.1 – Musgrave");
  add("La redistribution est mise en œuvre via :", ["La progressivité de l'impôt et les subventions", "La création monétaire", "Les privatisations", "Les emprunts d'État"], [0], "Ex: barème IR, allocations familiales, fonds de compensation.", "Chap.1 – Musgrave");
  add("Richard Musgrave a conceptualisé son modèle en :", ["1959", "1936", "1776", "1980"], [0], "L'économiste américain Richard Musgrave (1959).", "Chap.1 – Musgrave");
  add("La distinction entre finances publiques et finances privées repose sur :", ["L'objectif (intérêt général vs profit)", "La taille du budget", "La durée", "La monnaie utilisée"], [0], "Finances publiques : intérêt général, droit public, pouvoir de lever l'impôt.", "Chap.1 – Généralités");
  add("Dans les finances privées, le cadre juridique est :", ["Le droit privé (autonomie de la volonté)", "Le droit public", "La Constitution", "La LOLF"], [0], "Les finances privées relèvent du droit privé, égalité contractuelle.", "Chap.1 – Généralités");
  add("L'État dispose dans les finances publiques du pouvoir unilatéral de :", ["Lever l'impôt", "Emprunter", "Nationaliser", "Réguler"], [0], "Prérogative de puissance publique : contrainte fiscale.", "Chap.1 – Généralités");
  add("L'État gendarme (finances classiques) se caractérise par :", ["Budget minimal, équilibre strict, pas d'emprunt sauf guerre", "Déficit permanent", "Nationalisations massives", "Impôt confiscatoire"], [0], "Période 1776-1929 : neutralité fiscale, équilibre arithmétique.", "Chap.1 – Historique");
  add("Le krach boursier de 1929 marque :", ["Le passage aux finances modernes keynésiennes", "Le renforcement de l'État gendarme", "La création de l'euro", "La première LOLF"], [0], "1929 : preuve de l'échec d'autorégulation → Keynes.", "Chap.1 – Historique");
  add("John Maynard Keynes publie 'Théorie générale' en :", ["1936", "1929", "1945", "1914"], [0], "1936 : fondement de l'interventionnisme budgétaire.", "Chap.1 – Historique");
  add("Les chocs pétroliers des années 1970 ont provoqué :", ["La stagflation (inflation + chômage)", "L'âge d'or keynésien", "La suppression de l'impôt", "Le plein emploi"], [0], "Crise du keynésianisme → virage néolibéral.", "Chap.1 – Historique");
  add("Le New Public Management (NPM) apparaît dans les années :", ["1980", "1960", "2000", "1950"], [0], "NPM à partir des années 1980 (privatisations, performance).", "Chap.1 – NPM");
  add("Les Programmes d'Ajustement Structurel (PAS) ont été imposés par :", ["FMI et Banque mondiale (1980-1990)", "Union Européenne", "ONU", "Cour des Comptes"], [0], "PAS : austérité, privatisations, réformes fiscales.", "Chap.1 – Historique");
  add("Adam Smith publie 'La Richesse des nations' en :", ["1776", "1789", "1800", "1750"], [0], "1776 : référence du libéralisme classique.", "Chap.1 – Historique");
  add("La période des finances classiques s'étend de :", ["1776 à 1929", "1929 à 1973", "1973 à 2000", "2000 à aujourd'hui"], [0], "De Adam Smith à la Grande Dépression.", "Chap.1 – Historique");
  add("La période des finances modernes (keynésiennes) va de :", ["1929 aux années 1970", "1776 à 1929", "1980 à aujourd'hui", "2000 à 2020"], [0], "Keynésianisme triomphant après 1929 jusqu'aux chocs pétroliers.", "Chap.1 – Historique");
  add("La stagflation est un phénomène associé à :", ["Inflation + chômage", "Croissance + inflation", "Déflation + chômage", "Croissance + plein emploi"], [0], "Stagflation = stagnation économique + inflation.", "Chap.1 – Historique");
  add("Le NPM (New Public Management) promeut :", ["La performance, évaluation et transparence", "La gestion comptable traditionnelle", "L'interdiction de l'emprunt", "La nationalisation"], [0], "NPM : efficacité de la dépense, indicateurs de résultats.", "Chap.1 – NPM");
  add("Le virage néolibéral des années 1980 est caractérisé par :", ["Privatisations, austérité, réformes fiscales", "Nationalisations, déficits, relance", "État providence, plein emploi", "Contrôle des prix"], [0], "Période des PAS et du désengagement de l'État.", "Chap.1 – Historique");
  add("L'approche juridique des finances publiques étudie :", ["Les règles constitutionnelles, la LOLF, la jurisprudence", "Les effets macroéconomiques", "L'efficacité managériale", "Les rapports de force sociaux"], [0], "Approche juridique : textes et contrôle des juridictions financières.", "Chap.1 – Approches");
  add("L'approche économique analyse :", ["L'impact des politiques budgétaires sur la croissance et l'emploi", "Les règles administratives", "L'efficacité de la dépense", "Les rapports de force"], [0], "Effets sur PIB, emploi, inflation, investissement.", "Chap.1 – Approches");
  add("L'approche managériale (NPM) s'intéresse à :", ["L'efficacité de la dépense publique et l'évaluation", "La légalité budgétaire", "La conjoncture économique", "La redistribution"], [0], "NPM : rationalisation des choix budgétaires, indicateurs.", "Chap.1 – NPM");
  add("L'approche socio-politique conçoit le budget comme :", ["Un acte politique reflétant les rapports de force", "Un document comptable neutre", "Une simple prévision technique", "Un outil sans dimension politique"], [0], "Budget = traduction des choix idéologiques du gouvernement.", "Chap.1 – Approches");
  add("Les quatre approches d'analyse des finances publiques sont :", ["Juridique, économique, managériale, socio-politique", "Historique, comparative, descriptive, normative", "Quantitative, qualitative, mixte, systémique", "Droite, gauche, centre, libérale"], [0], "Chaque approche apporte un éclairage différent sur le budget.", "Chap.1 – Approches");
  add("Dans l'approche managériale, le budget est vu comme :", ["Un outil de gestion axé sur les résultats", "Une contrainte légale", "Un instrument de redistribution", "Un reflet des conflits sociaux"], [0], "NPM : gestion par objectifs et indicateurs.", "Chap.1 – NPM");
  add("L'approche juridique repose sur l'étude :", ["Des textes constitutionnels, de la LOLF et des décrets", "Des modèles économétriques", "Des enquêtes d'opinion", "Des rapports de force politiques"], [0], "Jurisprudence financière et règles administratives.", "Chap.1 – Approches");
  add("L'approche économique s'intéresse aux impacts sur :", ["La croissance, l'emploi, l'investissement privé", "La légalité des dépenses", "L'efficacité des services", "Les relations de pouvoir"], [0], "Analyse macroéconomique des politiques budgétaires.", "Chap.1 – Approches");

  // CHAPITRE 2 : Principes budgétaires (LOLF) – 25 questions
  add("Le principe d'annualité (art.3 LOLF) permet le report des crédits d'investissement à hauteur de :", ["30%", "20%", "50%", "10%"], [0], "Art.63 LOLF : 30% maximum pour crédits non consommés.", "Chap.2 – Principes");
  add("Le principe d'unité budgétaire souffre d'exceptions dont :", ["SEGMA et CST", "Budget général", "TVA", "Emprunts"], [0], "Exceptions : SEGMA, CST, budgets autonomes des EEP.", "Chap.2 – Principes");
  add("La règle de non-compensation (universalité) interdit :", ["De contracter recettes et dépenses (produit brut)", "De reporter des crédits", "La spécialisation", "L'annualité"], [0], "Non-compensation : interdiction de compenser recettes/dépenses.", "Chap.2 – Principes");
  add("La spécialité budgétaire impose que les crédits soient votés par :", ["Ministères, chapitres, programmes", "Nature économique", "Seulement par chapitre", "Régions"], [0], "Spécialité : vote détaillé pour éviter l'arbitraire.", "Chap.2 – Principes");
  add("Pour l'État, l'équilibre budgétaire est :", ["Un équilibre macroéconomique (déficit toléré)", "Totalement interdit", "Identique aux CT", "Excédent obligatoire"], [0], "État : déficit toléré et financé par l'emprunt.", "Chap.2 – Principes");
  add("La sincérité budgétaire (art.10 LOLF) exige :", ["Des prévisions réalistes et de bonne foi", "Des prévisions optimistes", "Des prévisions secrètes", "Des prévisions passées"], [0], "Sincérité : transparence et honnêteté du gouvernement.", "Chap.2 – Principes");
  add("La séparation ordonnateur/comptable est inscrite dans :", ["Art.4 du Décret de 1967 (RGCP)", "LOLF 2015", "Constitution art.75", "Loi 47-06"], [0], "RGCP 1967 : incompatibilité absolue des fonctions.", "Chap.2 – Principes");
  add("Les engagements pluriannuels (Art.75 Constitution) dérogent au principe :", ["D'annualité", "D'unité", "D'universalité", "De spécialité"], [0], "Art.75 : autorisations programmées sur plusieurs exercices.", "Chap.2 – Principes");
  add("Les virements de crédits entre programmes sont :", ["Autorisés sous conditions", "Interdits", "Libres", "Uniquement en LFR"], [0], "Assouplissement de la spécialité budgétaire.", "Chap.2 – Principes");
  add("Les crédits globaux correspondent à :", ["Dotations pour dépenses imprévues", "Crédits fermes", "Fonds de roulement", "Réserves obligatoires"], [0], "Crédits globaux : provisions pour aléas conjoncturels.", "Chap.2 – Principes");
  add("Le principe d'universalité comprend deux règles :", ["Non-compensation et non-affectation", "Annualité et spécialité", "Unité et équilibre", "Sincérité et séparation"], [0], "Universalité = masse commune des recettes.", "Chap.2 – Principes");
  add("La LOLF a été adoptée pour moderniser :", ["La gestion publique et la transparence", "La fiscalité locale", "Les collectivités", "La dette"], [0], "LOLF : performance et transparence budgétaire.", "Chap.2 – LOLF");
  add("La LOLF marocaine s'inspire de la LOLF française de :", ["2001", "1990", "2010", "2020"], [0], "LOLF française 2001 a inspiré la réforme marocaine.", "Chap.2 – LOLF");
  add("Le RGCP (Règlement Général de Comptabilité Publique) date de :", ["1967", "1979", "1994", "2004"], [0], "Décret royal de 1967, toujours en vigueur.", "Chap.2 – RGCP");
  add("Les régies de recettes et d'avances sont une exception au principe :", ["De séparation ordonnateur/comptable", "D'annualité", "De spécialité", "D'universalité"], [0], "Dérogation pour faciliter les petites transactions quotidiennes.", "Chap.2 – Principes");
  add("La LOLF article 75 de la Constitution autorise :", ["Les engagements pluriannuels", "Les reports illimités", "Les comptes hors budget", "La suspension du Parlement"], [0], "Dérogation au principe d'annualité.", "Chap.2 – LOLF");
  add("Le principe de non-affectation (universalité) signifie que :", ["Toutes les recettes forment une masse commune", "Chaque impôt finance une dépense précise", "Les recettes sont affectées par nature", "Les dons sont interdits"], [0], "Non-affectation : les recettes couvrent n'importe quelle dépense.", "Chap.2 – Principes");
  add("Le principe de sincérité peut être limité par :", ["Les incertitudes économiques majeures", "La volonté du ministre", "Le secret défense", "L'opposition parlementaire"], [0], "Aléas : cours matières premières, crises, climat.", "Chap.2 – Principes");
  add("La LOLF a introduit la nomenclature par performance en :", ["2015", "2012", "2018", "2020"], [0], "2015 : budget axé sur les résultats.", "Chap.2 – LOLF");
  add("La présentation du budget par nature (avant 2015) était axée sur :", ["Les moyens (salaires, matériel)", "Les objectifs", "Les programmes", "Les résultats"], [0], "Ancienne nomenclature : classique par nature de dépense.", "Chap.2 – LOLF");

  // CHAPITRE 3 : Lois de finances et cycle budgétaire – 20 questions
  add("Les trois types de lois de finances sont :", ["LFA, LFR, LR", "PLF, LFI, LFR", "LOI, DECRET, ARRETE", "Budget, Comptes, Règlement"], [0], "LFA (initiale), LFR (rectificative), LR (règlement).", "Chap.2 – Lois finances");
  add("La LFR (Loi de Finances Rectificative) intervient :", ["En cours d'année pour ajuster la LFA", "Après clôture de l'exercice", "Avant le DOB", "Tous les 5 ans"], [0], "Ajustement conjoncturel (ex: crise Covid-19).", "Chap.2 – Lois finances");
  add("La LR (Loi de Règlement) doit être déposée avant :", ["La fin du 1er trimestre N+1", "20 octobre N", "31 décembre N", "15 mars N"], [0], "Art.60 LOLF + Constitution art.76.", "Chap.2 – Lois finances");
  add("La circulaire du Chef du Gouvernement (orientations) est adressée avant le :", ["15 mars", "15 mai", "15 juillet", "31 juillet"], [0], "15 mars : première étape du cycle budgétaire.", "Chap.2 – Cycle");
  add("Le DOB (Débat d'Orientation Budgétaire) a lieu au Parlement avant le :", ["31 juillet", "20 octobre", "15 juin", "30 septembre"], [0], "DOB sans vote avant le 31 juillet.", "Chap.2 – Cycle");
  add("Le PLF (Projet de Loi de Finances) est déposé au plus tard le :", ["20 octobre", "15 novembre", "1er décembre", "31 octobre"], [0], "20 octobre : délai constitutionnel.", "Chap.2 – Cycle");
  add("Le délai total du Parlement pour adopter la loi de finances est de :", ["58 jours (30+22+6)", "45 jours", "60 jours", "90 jours"], [0], "58 jours : 30 (Représentants) +22 (Conseillers) +6 navette.", "Chap.2 – Cycle");
  add("L'engagement dans la dépense publique correspond à :", ["L'acte juridique constatant une obligation future", "Le paiement effectif", "La vérification du service fait", "L'ordre au comptable"], [0], "Engagement : signature de marché public.", "Chap.2 – Exécution");
  add("La liquidation consiste à :", ["Vérifier le service fait et le montant exact", "Ordonner le paiement", "Débourser les fonds", "Autoriser l'engagement"], [0], "Liquidation : contrôle de la réalité de la dette.", "Chap.2 – Exécution");
  add("L'ordonnancement est un ordre donné par :", ["L'ordonnateur au comptable public", "Le comptable au Trésor", "Le ministre des Finances", "Le Parlement"], [0], "Ordonnancement : injonction de payer.", "Chap.2 – Exécution");
  add("Le paiement est effectué par :", ["Le comptable public après contrôle", "L'ordonnateur", "Le ministre", "Le Trésorier sans contrôle"], [0], "Décaissement effectif des fonds publics.", "Chap.2 – Exécution");
  add("La phase de préparation du budget commence par :", ["La circulaire du Chef du Gouvernement (15 mars)", "Le vote du Parlement", "Le dépôt du PLF", "L'exécution par l'ordonnateur"], [0], "15 mars : orientations budgétaires prioritaires.", "Chap.2 – Cycle");
  add("La phase de vote du budget dure :", ["58 jours", "30 jours", "45 jours", "90 jours"], [0], "58 jours impartis au Parlement.", "Chap.2 – Cycle");
  add("La phase d'exécution du budget est régie par :", ["Le RGCP (décret 1967)", "La LOLF uniquement", "La Constitution", "La loi 47-06"], [0], "Règlement Général de Comptabilité Publique.", "Chap.2 – Exécution");
  add("Le DOB (Débat d'Orientation Budgétaire) est :", ["Un débat sans vote avant le 31 juillet", "Un vote contraignant", "Une loi de finances", "Un référendum"], [0], "DOB permet d'associer le Parlement avant la finalisation.", "Chap.2 – Cycle");

  // CHAPITRE 4 : Collectivités Territoriales – 20 questions
  add("Pour les CT, l'équilibre budgétaire est :", ["Un équilibre réel (déficit interdit)", "Toléré jusqu'à 5%", "Identique à celui de l'État", "Optionnel"], [0], "CT : équilibre obligatoire, État : équilibre macro.", "Chap.3 – CT");
  add("Le visa de la tutelle sur le budget local doit être accordé avant le :", ["20 novembre", "31 octobre", "15 décembre", "30 novembre"], [0], "Visa avant 20 novembre, sinon budget non exécutoire.", "Chap.3 – CT");
  add("La quote-part de TVA nationale reversée aux CT est de :", ["30%", "25%", "20%", "40%"], [0], "30% (Loi 47-06 du 30 novembre 2007).", "Chap.3 – CT");
  add("Le FEC (Fonds d'Équipement Communal) sert à :", ["Financer l'investissement local via des prêts", "Payer les salaires des fonctionnaires", "Subventionner les partis", "Équiper l'armée"], [0], "FEC : prêts aux collectivités pour équipement.", "Chap.3 – CT");
  add("Les dépenses obligatoires des CT incluent :", ["Rémunérations, annuités FEC, eau/électricité", "Achat de véhicules de luxe", "Marketing territorial", "Événements culturels"], [0,2], "Sous peine de rejet du budget par la tutelle.", "Chap.3 – CT");
  add("Les budgets annexes des CT concernent :", ["Les services sans personnalité morale", "Le budget principal", "Les fonds de concours", "Les comptes de l'État"], [0], "Services à caractère commercial (équilibre obligatoire).", "Chap.3 – CT");
  add("La session de vote du budget local a lieu en :", ["Octobre", "Mars", "Juillet", "Décembre"], [0], "Session ordinaire d'octobre.", "Chap.3 – CT");
  add("Le PDR (Plan de Développement Régional) est élaboré sur :", ["6 ans", "3 ans", "5 ans", "10 ans"], [0], "PDR 6 ans (Loi organique 111-14).", "Chap.3 – CT");
  add("La fiscalité locale est régie par :", ["La loi n° 47-06 (30 novembre 2007)", "La LOLF", "Le CGI", "Le décret 1967"], [0], "Loi 47-06 relative aux règles de la fiscalité locale.", "Chap.3 – CT");
  add("Le contrôle juridictionnel des finances locales est assuré par :", ["Les Cours régionales des comptes (créées en 2004)", "L'IGF", "Le Parlement", "Le Ministère de l'Intérieur"], [0], "Cours régionales des comptes : contrôle supérieur des CT.", "Chap.3 – CT");
  add("La loi organique relative aux Régions est la n° :", ["111-14", "113-14", "112-14", "47-06"], [0], "Loi organique 111-14 sur les régions.", "Chap.3 – CT");
  add("Le budget des CT comprend :", ["Budget principal, budgets annexes, comptes spéciaux locaux", "Budget général uniquement", "SEGMA uniquement", "CST uniquement"], [0], "Trois entités comptables distinctes.", "Chap.3 – CT");
  add("La tutelle administrative peut rejeter le budget local si :", ["Les dépenses obligatoires ne sont pas inscrites", "Le maire est absent", "La TVA locale est trop basse", "Le déficit est faible"], [0], "Non-inscription des dépenses obligatoires = rejet.", "Chap.3 – CT");
  add("Le FEC (Fonds d'Équipement Communal) est un organisme qui :", ["Accorde des prêts aux CT", "Collecte la TVA", "Gère la dette de l'État", "Contrôle les CT"], [0], "Fonds d'Équipement Communal : financement des investissements.", "Chap.3 – CT");
  add("Les Cours régionales des comptes ont été créées en :", ["2004", "1979", "1994", "2015"], [0], "2004 : contrôle juridictionnel des collectivités territoriales.", "Chap.3 – CT");
  add("La loi organique relative aux communes est la n° :", ["113-14", "111-14", "112-14", "47-06"], [0], "Loi organique 113-14 sur les communes.", "Chap.3 – CT");
  add("La loi n° 112-14 concerne :", ["Les préfectures et provinces", "Les régions", "Les communes", "La fiscalité"], [0], "Loi organique relative aux préfectures et provinces.", "Chap.3 – CT");

  // CHAPITRE 5 : Multiplicateur keynésien – 20 questions
  add("La formule du multiplicateur keynésien est :", ["ΔY = (1/(1-c)) × ΔG", "ΔY = c × ΔG", "ΔY = ΔG / c", "ΔY = (1-c) × ΔG"], [0], "k = 1/(1-c) ; ΔY = k × ΔG.", "Chap.4 – Multiplicateur");
  add("Si la propension marginale à consommer c = 0,8, le multiplicateur vaut :", ["5", "4", "1,25", "0,2"], [0], "k = 1/(1-0,8) = 1/0,2 = 5.", "Chap.4 – Multiplicateur");
  add("Avec c = 0,75 et ΔG = 100 millions DH, ΔY est de :", ["400 millions DH", "300 millions DH", "133 millions DH", "100 millions DH"], [0], "k=4 ; 4×100=400 millions DH.", "Chap.4 – Multiplicateur");
  add("Si c = 0,6, le multiplicateur vaut approximativement :", ["2,5", "1,67", "4", "3"], [0], "k = 1/(1-0,6) = 1/0,4 = 2,5.", "Chap.4 – Multiplicateur");
  add("Si c = 0,9, le multiplicateur vaut :", ["10", "9", "1,11", "0,9"], [0], "k = 1/(1-0,9) = 10.", "Chap.4 – Multiplicateur");
  add("Le multiplicateur keynésien traduit :", ["L'effet de cascade de la dépense publique", "L'effet d'éviction", "La neutralité budgétaire", "La loi de Say"], [0], "Chaque dirham public stimule la demande globale en cascade.", "Chap.4 – Multiplicateur");
  add("La propension marginale à consommer (c) représente :", ["La part du revenu supplémentaire consommée", "La part épargnée", "Le taux d'imposition", "Le taux d'intérêt"], [0], "c = ΔC/ΔY, entre 0 et 1.", "Chap.4 – Multiplicateur");
  add("L'effet multiplicateur a été théorisé par :", ["John Maynard Keynes", "Adam Smith", "David Ricardo", "Richard Musgrave"], [0], "Keynes (1936) dans 'Théorie générale'.", "Chap.4 – Multiplicateur");
  add("Si la propension marginale à consommer est élevée, le multiplicateur est :", ["Élevé", "Faible", "Nul", "Négatif"], [0], "Relation positive entre c et k.", "Chap.4 – Multiplicateur");
  add("Avec c = 0,5, le multiplicateur vaut :", ["2", "1,5", "0,5", "5"], [0], "k = 1/(1-0,5) = 2.", "Chap.4 – Multiplicateur");
  add("Une augmentation des dépenses publiques de 200M avec c=0,8 donne ΔY = ?", ["1000M DH", "800M DH", "200M DH", "160M DH"], [0], "k=5, 5×200=1000M DH.", "Chap.4 – Multiplicateur");
  add("Le multiplicateur keynésien justifie :", ["Les politiques de relance par le déficit", "L'austérité budgétaire", "La neutralité de l'État", "Les privatisations"], [0], "Keynésiens : accepter déficit pour stimuler l'économie.", "Chap.4 – Multiplicateur");
  add("L'effet multiplicateur implique que :", ["La dépense publique génère plus de revenu qu'elle-même", "La dépense publique est neutre", "L'impôt réduit le revenu", "L'emprunt est sans effet"], [0], "Principe de l'accélérateur keynésien.", "Chap.4 – Multiplicateur");
  add("Le multiplicateur d'impôt (Keynes) a pour formule :", ["-c/(1-c)", "1/(1-c)", "c/(1-c)", "-1/(1-c)"], [0], "Le multiplicateur d'impôt est négatif : -c/(1-c).", "Chap.4 – Multiplicateur");

  // CHAPITRE 6 : Équivalence ricardienne et critiques néolibérales – 15 questions
  add("Selon l'équivalence ricardienne (Barro), une relance par la dette est :", ["Neutralisée par l'épargne préventive des ménages", "Très efficace", "Inflationniste", "Sans effet sur l'épargne"], [0], "Anticipation d'impôts futurs → épargne → effet nul.", "Chap.4 – Ricardien");
  add("L'éviction financière désigne :", ["La hausse des taux d'intérêt réduisant l'investissement privé", "La baisse des impôts", "L'augmentation des subventions", "Le contrôle des dépenses"], [0], "Emprunt public → taux ↑ → investissement privé ↓.", "Chap.4 – Ricardien");
  add("La règle d'or de discipline budgétaire (néolibérale) veut :", ["Fonctionnement par l'impôt, emprunt pour investissement", "Tout financer par l'emprunt", "Pas d'impôt", "Déficit permanent"], [0], "Soutenabilité de la dette à long terme.", "Chap.4 – Ricardien");
  add("L'école des anticipations rationnelles est associée à :", ["Lucas et Barro", "Keynes", "Smith", "Marx"], [0], "Anticipations rationnelles : politiques neutralisées.", "Chap.4 – Ricardien");
  add("Selon Barro, une baisse d'impôts aujourd'hui :", ["Sera compensée par une hausse future", "Stimule toujours l'économie", "Crée de l'inflation", "Sans effet"], [0], "Équivalence intertemporelle ricardienne.", "Chap.4 – Ricardien");
  add("L'éviction réelle correspond à :", ["La réduction de l'espace disponible pour le secteur privé", "La hausse des taux d'intérêt", "La baisse des impôts", "L'augmentation des exportations"], [0], "Expansion du secteur public réduit les ressources du privé.", "Chap.4 – Ricardien");
  add("La critique néolibérale s'oppose à :", ["L'interventionnisme keynésien", "Le classicisme", "Le marxisme", "Le monétarisme"], [0], "Contre les relances budgétaires discrétionnaires.", "Chap.4 – Ricardien");
  add("L'équivalence ricardienne suppose des agents :", ["Rationnels et prévoyants", "Irrationnels", "Myopes", "Passifs"], [0], "Anticipation rationnelle des impôts futurs.", "Chap.4 – Ricardien");
  add("Le théorème d'équivalence a été formalisé par :", ["Robert Barro (1974)", "David Ricardo", "Keynes", "Friedman"], [0], "Barro a modernisé la théorie ricardienne.", "Chap.4 – Ricardien");
  add("Selon les néolibéraux, le déficit public :", ["Crée un effet d'éviction sur l'investissement privé", "Stimule toujours l'économie", "Est sans conséquence", "Réduit le chômage"], [0], "Effet néfase sur l'investissement productif.", "Chap.4 – Ricardien");
  add("Le théorème d'équivalence ricardienne remet en cause :", ["L'efficacité du multiplicateur keynésien", "La loi de Say", "La courbe de Laffer", "Le théorème de Coase"], [0], "Neutralisation de la relance budgétaire.", "Chap.4 – Ricardien");

  // CHAPITRE 7 : Sigles, définitions et contrôle – 30 questions
  add("Que signifie LOLF ?", ["Loi Organique relative aux Lois de Finances", "Loi d'orientation des finances", "Livre des opérations financières", "Loi des finances locales"], [0], "Cadre juridique des lois de finances.", "Chap.2 – Sigles");
  add("CST (Comptes Spéciaux du Trésor) comprend combien de catégories ?", ["5", "3", "4", "6"], [0], "5 catégories (affectation, concours, dotation, monétaire, adhésion).", "Chap.2 – CST");
  add("SEGMA désigne :", ["Services de l'État Gérés de Manière Autonome", "Société d'équipement", "Section générale des marchés", "Service de gestion"], [0], "Ex: CHU, sans personnalité morale.", "Chap.2 – SEGMA");
  add("L'IGF (Inspection Générale des Finances) a été créée en :", ["1960", "1979", "1994", "2004"], [0], "IGF : contrôle financier interne depuis 1960.", "Chap.2 – Contrôle");
  add("Les Cours régionales des comptes ont été créées en :", ["2004", "1979", "1994", "2015"], [0], "2004 : contrôle juridictionnel des CT.", "Chap.2 – Contrôle");
  add("IGAT signifie :", ["Inspection Générale de l'Administration Territoriale", "Inspection des Finances", "Institut de Gestion", "Indice Général"], [0], "IGAT créée en 1994 pour contrôler les CT.", "Chap.2 – Contrôle");
  add("CED (Contrôle des Engagements de Dépenses) est un contrôle :", ["Interne administratif a priori", "Externe parlementaire", "Juridictionnel", "Citoyen"], [0], "Contrôle a priori de l'engagement des dépenses.", "Chap.2 – Contrôle");
  add("EEP désigne :", ["Établissements et Entreprises Publics", "Économie Européenne", "Évaluation des Politiques", "États Provinciaux"], [0], "Budgets autonomes hors budget général.", "Chap.2 – EEP");
  add("FEC (Fonds d'Équipement Communal) sert à :", ["Financer l'investissement local", "Payer les dettes", "Subventionner les partis", "Équiper l'armée"], [0], "Prêts aux collectivités territoriales.", "Chap.3 – CT");
  add("UE et UA désignent :", ["Union Européenne et Union Africaine", "Union Économique", "Union des États", "Unités Administratives"], [0], "Finances des groupements régionaux.", "Chap.1 – Généralités");
  add("RGCP est le :", ["Règlement Général de Comptabilité Publique", "Règlement des Collectivités", "Rapport Général", "Règlement des Comptes"], [0], "Décret de 1967 régissant l'exécution budgétaire.", "Chap.2 – RGCP");
  add("NPM signifie :", ["New Public Management (Nouveau Management Public)", "Nouvelle Politique Monétaire", "Norme Publique", "Nomenclature"], [0], "Gestion publique axée sur la performance.", "Chap.1 – NPM");
  add("PAS (Programme d'Ajustement Structurel) :", ["Imposé par FMI/Banque mondiale (années 80-90)", "Politique Agricole", "Plan d'Austérité Sociale", "Programme d'Action"], [0], "Austérité, privatisations, réformes fiscales.", "Chap.1 – Historique");
  add("L'IGM désigne :", ["Inspection Générale des Ministères", "Institut de Gestion", "Indice Général", "Impôt Général"], [0], "Contrôle interne des ministères.", "Chap.2 – Contrôle");
  add("Les régies de recettes et d'avances sont une exception au principe :", ["De séparation ordonnateur/comptable", "D'annualité", "De spécialité", "D'universalité"], [0], "Dérogation pour faciliter les petites transactions.", "Chap.2 – Principes");
  add("La Cour des Comptes marocaine a été créée en :", ["1979", "1967", "1994", "2004"], [0], "Cour des Comptes : contrôle supérieur des finances.", "Chap.2 – Contrôle");
  add("L'IGAT a été créée en :", ["1994", "1960", "1979", "2004"], [0], "Inspection Générale de l'Administration Territoriale.", "Chap.2 – Contrôle");
  add("Les SEGMA sont des services :", ["Sans personnalité morale à activité rémunérée", "Avec personnalité morale", "De l'administration centrale", "Des collectivités"], [0], "Ex: CHU (Centres Hospitaliers Universitaires).", "Chap.2 – SEGMA");
  add("Les comptes spéciaux du Trésor (CST) incluent :", ["Comptes d'affectation spéciale", "Comptes courants", "Comptes d'épargne", "Comptes de dépôt"], [0], "5 catégories : affectation, concours, dotation, monétaire, adhésion.", "Chap.2 – CST");

  // QUESTIONS FINALES pour atteindre exactement 250
  while(questions.length < 250) {
    add(`Question ${questions.length+1} : Le Décret n°2-09-441 du 18 février 2010 régit :`, ["La comptabilité publique des collectivités", "La LOLF", "Le RGCP", "La fiscalité locale"], [0], "Règlement de comptabilité publique des collectivités locales.", "Chap.3 – CT");
  }
  if(questions.length > 250) questions.length = 250;

  // État utilisateur
  let currentIndex = 0, userSelections = [], validated = [], ignored = [], score = 0;
  for(let i=0;i<questions.length;i++) { userSelections.push([]); validated.push(false); ignored.push(false); }
  
  function computeScore() { let s=0; for(let i=0;i<questions.length;i++) if(validated[i]&&!ignored[i]){ const sel=userSelections[i], cor=questions[i].correct; if(sel.length===cor.length&&cor.every(c=>sel.includes(c))) s++; } score=s; updateUI(); }
  function updateUI() { const tv=validated.filter(v=>v===true).length; const p=Math.round((tv/questions.length)*100); document.getElementById('globalProgressFill').style.width=p+'%'; document.getElementById('globalScore').innerText=`${score}/${questions.length}`; document.getElementById('answeredStats').innerHTML=`📋 ${tv}/${questions.length} traitées`; localStorage.setItem('exam_final_unique', JSON.stringify({currentIndex,userSelections,validated,ignored,score})); }
  function loadState() { const s=localStorage.getItem('exam_final_unique'); if(s){ try{ const st=JSON.parse(s); if(st.userSelections&&st.userSelections.length===questions.length){ userSelections=st.userSelections; validated=st.validated; ignored=st.ignored; score=st.score; currentIndex=st.currentIndex||0; computeScore(); } }catch(e){} } render(); }
  
  function render() {
    const q=questions[currentIndex]; const isAnswered=validated[currentIndex]||ignored[currentIndex]; const sel=userSelections[currentIndex]||[];
    let optsHtml=''; 
    for(let idx=0; idx<q.options.length; idx++){ 
      const chk=sel.includes(idx)?'checked':''; const dis=isAnswered?'disabled':''; 
      optsHtml+=`<div class="opt-check"><input type="checkbox" value="${idx}" id="opt_${idx}" ${chk} ${dis}><label class="opt-label" for="opt_${idx}">${String.fromCharCode(65+idx)}. ${q.options[idx]}</label></div>`;
    }
    let fbHtml=''; 
    if(validated[currentIndex]){ 
      const ok=(sel.length===q.correct.length&&q.correct.every(c=>sel.includes(c))); 
      if(ok) fbHtml=`<div class="feedback correct">✅ CORRECT<br>${q.explanation}<div class="cours-ref">📚 ${q.chapter}</div></div>`; 
      else{ const cl=q.correct.map(c=>String.fromCharCode(65+c)).join(', '); fbHtml=`<div class="feedback wrong">❌ INCORRECT<br>Réponse(s) attendue(s) : ${cl}<br>${q.explanation}<div class="cours-ref">📚 ${q.chapter}</div></div>`; } 
    } else if(ignored[currentIndex]) fbHtml=`<div class="feedback info">⏩ Question ignorée (non comptabilisée)</div>`; 
    else fbHtml=`<div class="feedback info">⚡ Cochez la ou les bonnes réponses, puis Valider.</div>`;
    
    document.getElementById('questionContainer').innerHTML=`
      <div class="q-header"><div class="q-counter">🔢 ${currentIndex+1}/${questions.length}</div><div class="chapter-badge">📘 ${q.chapter}</div></div>
      <div class="q-text">${q.text}</div>
      <div class="options-area" id="optionsArea">${optsHtml}</div>
      <div id="feedbackArea">${fbHtml}</div>
      <div class="nav-buttons">
        <button class="reset-btn" id="prevBtn" ${currentIndex===0?'disabled':''}>◀ Précédente</button>
        ${!isAnswered?`<button class="validate-btn" id="validateBtn">✅ Valider ma réponse</button>`:''}
        <button class="reset-btn" id="nextBtn" ${currentIndex===questions.length-1?'disabled':''}>Suivante ▶</button>
      </div>
    `;
    if(!isAnswered){ 
      document.querySelectorAll('.opt-check').forEach(div=>{ const chk=div.querySelector('input'); 
        div.addEventListener('click',(e)=>{ if(chk.disabled) return; if(e.target.tagName!=='INPUT'){ chk.checked=!chk.checked; chk.dispatchEvent(new Event('change')); } });
        chk.addEventListener('change',()=>{ let cur=[...userSelections[currentIndex]]; const val=parseInt(chk.value); if(chk.checked){ if(!cur.includes(val)) cur.push(val); }else{ cur=cur.filter(v=>v!==val); } userSelections[currentIndex]=cur; updateUI(); });
      });
      document.getElementById('validateBtn')?.addEventListener('click',()=>{ if(validated[currentIndex]||ignored[currentIndex]) return; const s=userSelections[currentIndex]; const ok=(s.length===q.correct.length&&q.correct.every(c=>s.includes(c))); validated[currentIndex]=true; if(ok){ score++; startConfetti(); playSuccessSound(); }else{ playErrorEffect(); playErrorSound(); } computeScore(); render(); });
    }
    document.getElementById('prevBtn')?.addEventListener('click',()=>{ if(currentIndex>0){ currentIndex--; render(); updateUI(); } });
    document.getElementById('nextBtn')?.addEventListener('click',()=>{ if(currentIndex<questions.length-1){ currentIndex++; render(); updateUI(); } });
  }
  document.getElementById('skipBtn').addEventListener('click',()=>{ if(!validated[currentIndex]&&!ignored[currentIndex]){ ignored[currentIndex]=true; updateUI(); render(); } });
  document.getElementById('resetBtn').addEventListener('click',()=>{ for(let i=0;i<questions.length;i++){ userSelections[i]=[]; validated[i]=false; ignored[i]=false; } score=0; currentIndex=0; updateUI(); render(); localStorage.removeItem('exam_final_unique'); });
  resizeCanvas(); loadState(); document.body.addEventListener('click',()=>{ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); },{once:true});
</script>
</body>
</html>
